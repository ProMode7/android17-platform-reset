org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9's new DSL compiles Kotlin itself ("built-in Kotlin"); the standalone
# org.jetbrains.kotlin.android plugin is not applied anywhere in this project. The Kotlin Gradle
# Plugin version used for that built-in compilation is pinned explicitly in the root
# build.gradle.kts buildscript block instead. See https://kotl.in/gradle/agp-built-in-kotlin
android.builtInKotlin=true
